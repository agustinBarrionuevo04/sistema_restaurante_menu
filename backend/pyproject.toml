[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menu-backend"
version = "0.1.0"
description = "Backend FastAPI para carta digital"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.18",
  "boto3>=1.36.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx2>=0.28.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) como default en dependencias y endpoints es el patrón canónico de FastAPI
"app/deps.py" = ["B008"]
"app/routers/*.py" = ["B008"]
"app/services/*.py" = ["B008"]
# Forward references en modelos SQLModel (resuelve el framework en runtime)
"app/models/*.py" = ["F821"]
# Re-exportaciones intencionales en __init__ (aggregator del paquete)
"app/__init__.py" = ["F401"]
"app/routers/__init__.py" = ["F401"]
