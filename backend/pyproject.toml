[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "menu-backend"
version = "0.1.0"
description = "Backend FastAPI para carta digital"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlmodel>=0.0.22",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.18",
  "boto3>=1.36.0",
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
